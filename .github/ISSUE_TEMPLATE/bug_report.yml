name: Bug report
description: Report a problem we can reproduce and investigate.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve quirq. Please report this in the repository that owns the affected code and check for an existing issue first.

        For setup questions, use [XO Space Discussions](https://github.com/quirq-ai/xo-space/discussions). For suspected vulnerabilities, follow our [private reporting instructions](https://github.com/quirq-ai/.github/blob/main/SECURITY.md).
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Share the smallest example or sequence of steps that shows the problem. If it is intermittent, describe when you observed it.
      placeholder: |
        1. Start with…
        2. Run or open…
        3. Observe…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the affected version or commit if you know it.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant details such as operating system, browser, installation method, or agent runtime.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Paste relevant output or attach files here. Remove API keys, tokens, cookies, personal information, and private project content before sharing.
